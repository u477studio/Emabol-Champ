<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emabol Champ - Anotarse</title>
  <style>
    :root {
      --verde: #2e7d32;
      --rojo: #c62828;
      --gris: #f5f5f5;
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: var(--gris); }
    .contenedor { max-width: 480px; margin: 0 auto; padding: 16px; }
    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .fecha { color: #666; }
    .boton {
      display: block;
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .boton-anotar { background: var(--verde); color: white; }
    .boton-baja { background: var(--rojo); color: white; }
    .boton:disabled { background: #ccc; cursor: not-allowed; }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    input:disabled {
      background: #eee;
      color: #888;
    }
    .lista { list-style: none; padding: 0; }
    .lista li {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .cupo { font-size: 14px; color: #555; }
    .mensaje-estado {
      display: none;
      color: var(--rojo);
      font-weight: bold;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!-- Info del partido -->
    <div class="tarjeta">
      <h1>⚽ Próximo partido</h1>
      <div id="infoPartido">Cargando...</div>
      <p class="cupo" id="cupo"></p>
    </div>

    <!-- Formulario de inscripción -->
    <div class="tarjeta">
      <h2>Anotarme</h2>
      <input type="text" id="nombre" placeholder="Tu nombre o apodo">
      <input type="tel" id="telefono" placeholder="Teléfono (opcional)">
      <p id="mensajeEstado" class="mensaje-estado"></p>
      <button class="boton boton-anotar" id="btnAnotar" disabled>Anotarme</button>
      <button class="boton boton-baja" id="btnBaja" style="display:none;">Darme de baja</button>
    </div>

    <!-- Lista única de anotados -->
    <div class="tarjeta">
      <h2>Jugadores anotados (<span id="cantidad">0</span>)</h2>
      <ul class="lista" id="listaInscriptos"></ul>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ⚠️ PEGÁ ACA TU CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDs7dUZPdqYvjI7AjYx0RoDoS3X1auaN3A",
      authDomain: "emabol-stars.firebaseapp.com",
      projectId: "emabol-stars",
      storageBucket: "emabol-stars.firebasestorage.app",
      messagingSenderId: "908515702679",
      appId: "1:908515702679:web:583944869a7dd163d276d2"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PARTIDO_ID = "proximo-partido";

    // ID único del dispositivo (para identificar al jugador)
    function generarId() {
      return Math.random().toString(36).substring(2) + Date.now().toString(36);
    }
    const usuarioId = localStorage.getItem('usuarioId') || generarId();
    localStorage.setItem('usuarioId', usuarioId);

    const partidoRef = db.collection('partidos').doc(PARTIDO_ID);
    const inscriptosRef = partidoRef.collection('inscriptos');

    let partidoActual = null;

    // ---------- ESCUCHAR CAMBIOS DEL PARTIDO ----------
    partidoRef.onSnapshot((doc) => {
      if (!doc.exists) {
        document.getElementById('infoPartido').textContent = 'No hay partido programado.';
        document.getElementById('cupo').textContent = '';
        return;
      }

      partidoActual = doc.data();
      const estado = partidoActual.estado || 'abierto';
      const estadoTexto = estado === 'cerrado' ? '🔒 Cerrado' : '🟢 Abierto';

      document.getElementById('infoPartido').innerHTML = `
        <div class="fecha">📅 ${partidoActual.fecha || 'Fecha sin definir'} - ${partidoActual.hora || 'Hora sin definir'}</div>
        <p>📍 ${partidoActual.lugar || 'Lugar sin definir'}</p>
        <p>💰 $${partidoActual.costo || 0} por jugador</p>
        <p>💸 Alias para transferir: <strong>${partidoActual.aliasPago || 'CASANAKED'}</strong></p>
        <p>Estado: <strong>${estadoTexto}</strong></p>
      `;

      actualizarBoton();
    });

    // ---------- ESCUCHAR INSCRIPTOS ----------
    inscriptosRef.onSnapshot((snapshot) => {
      const activos = [];

      snapshot.forEach((doc) => {
        const data = doc.data();
        if (data.estado === 'activo') {
          activos.push({
            id: doc.id,
            nombre: data.nombre,
            telefono: data.telefono || ''
          });
        }
      });

      // Ordenar alfabéticamente por nombre (ignora mayúsculas/minúsculas)
      activos.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' }));

      const lista = document.getElementById('listaInscriptos');
      lista.innerHTML = '';

      activos.forEach((jugador) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${jugador.nombre}</span>${jugador.telefono ? `<small>${jugador.telefono}</small>` : ''}`;
        lista.appendChild(li);
      });

      document.getElementById('cantidad').textContent = activos.length;

      const cupo = partidoActual?.cupo || 18;
      const total = activos.length;
      document.getElementById('cupo').textContent = `Cupo: ${total}/${cupo} (${total} anotados)`;

      actualizarBoton();
    });

    // ---------- ACTUALIZAR BOTONES ----------
    function actualizarBoton() {
      const btnAnotar = document.getElementById('btnAnotar');
      const btnBaja = document.getElementById('btnBaja');
      const mensajeEstado = document.getElementById('mensajeEstado');
      const inputNombre = document.getElementById('nombre');
      const inputTelefono = document.getElementById('telefono');

      if (!partidoActual) {
        btnAnotar.disabled = true;
        mensajeEstado.style.display = 'none';
        return;
      }

      // Si el partido está cerrado
      if (partidoActual.estado === 'cerrado') {
        mensajeEstado.textContent = '❌ Inscripción cerrada';
        mensajeEstado.style.display = 'block';
        btnAnotar.disabled = true;
        btnAnotar.textContent = 'Inscripción cerrada';
        inputNombre.disabled = true;
        inputTelefono.disabled = true;

        // Si ya estaba anotado, permitir darse de baja
        inscriptosRef.doc(usuarioId).get().then((doc) => {
          if (doc.exists && doc.data().estado === 'activo') {
            btnBaja.style.display = 'block';
            btnBaja.textContent = 'Darme de baja';
          } else {
            btnBaja.style.display = 'none';
          }
        });
        return;
      }

      // Si el partido está abierto
      mensajeEstado.style.display = 'none';
      inputNombre.disabled = false;
      inputTelefono.disabled = false;
      btnAnotar.textContent = 'Anotarme';

      inscriptosRef.doc(usuarioId).get().then((doc) => {
        if (doc.exists && doc.data().estado === 'activo') {
          btnAnotar.style.display = 'none';
          btnBaja.style.display = 'block';
          btnBaja.textContent = 'Darme de baja';
        } else {
          btnAnotar.style.display = 'block';
          btnBaja.style.display = 'none';
          btnAnotar.disabled = false;
        }
      });
    }

    // ---------- ANOTARSE ----------
    document.getElementById('btnAnotar').addEventListener('click', async () => {
      const nombre = document.getElementById('nombre').value.trim();
      if (!nombre) {
        alert('Poné tu nombre o apodo');
        return;
      }

      const telefono = document.getElementById('telefono').value.trim();

      await inscriptosRef.doc(usuarioId).set({
        nombre,
        telefono,
        estado: 'activo',
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      document.getElementById('nombre').value = '';
      document.getElementById('telefono').value = '';
    });

    // ---------- DARSE DE BAJA ----------
    document.getElementById('btnBaja').addEventListener('click', async () => {
      if (!confirm('¿Seguro que te das de baja?')) return;
      await inscriptosRef.doc(usuarioId).update({ estado: 'baja' });
    });
  </script>
</body>
</html>
