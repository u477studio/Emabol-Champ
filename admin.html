<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Emabol Champ</title>
  <style>
    :root {
      --verde: #2e7d32;
      --rojo: #c62828;
      --azul: #1565c0;
      --gris: #f5f5f5;
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: var(--gris); }
    .contenedor { max-width: 600px; margin: 0 auto; padding: 16px; }
    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    h3 { margin: 8px 0; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .boton {
      display: inline-block;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 2px;
    }
    .boton-verde { background: var(--verde); color: white; }
    .boton-rojo { background: var(--rojo); color: white; }
    .boton-azul { background: var(--azul); color: white; }
    .boton-gris { background: #666; color: white; }
    .oculto { display: none; }
    .lista-inscriptos { list-style: none; padding: 0; }
    .lista-inscriptos li {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .estado-activo { color: var(--verde); font-weight: bold; }
    .estado-baja { color: var(--rojo); font-weight: bold; }
    .error { color: var(--rojo); margin: 8px 0; }
    .exito { color: var(--verde); margin: 8px 0; }
    .equipo {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
      min-height: 50px;
    }
    .equipo ul { list-style: none; padding: 0; }
    .equipo li {
      padding: 8px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin: 4px 0;
      cursor: grab;
    }
    .jugador-disponible {
      padding: 8px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin: 4px 0;
      cursor: grab;
    }
    .drag-over {
      border: 2px dashed var(--azul);
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!-- Login -->
    <div id="login" class="tarjeta">
      <h1>🔐 Admin Emabol</h1>
      <div id="loginError" class="error oculto"></div>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button class="boton boton-verde" id="btnLogin">Entrar</button>
    </div>

    <!-- Panel admin (oculto hasta loguearse) -->
    <div id="panelAdmin" class="oculto">
      <div class="tarjeta">
        <h1>⚽ Admin Emabol</h1>
        <button class="boton boton-gris" id="btnLogout">Cerrar sesión</button>
      </div>

      <!-- Editar partido -->
      <div class="tarjeta">
        <h2>Próximo partido</h2>
        <div id="guardarMensaje" class="oculto"></div>
        <label>Fecha</label>
        <input type="text" id="fecha">
        <label>Hora</label>
        <input type="text" id="hora">
        <label>Lugar</label>
        <input type="text" id="lugar">
        <label>Costo por jugador</label>
        <input type="number" id="costo">
        <label>Alias para transferencia</label>
        <input type="text" id="aliasPago" placeholder="Ej: CASANAKED">
        <label>Cupo</label>
        <input type="number" id="cupo">
        <label>Estado</label>
        <select id="estado">
          <option value="abierto">Abierto</option>
          <option value="cerrado">Cerrado</option>
        </select>
        <button class="boton boton-azul" id="btnGuardarPartido">Guardar cambios</button>
        <button class="boton boton-rojo" id="btnCerrarPartido">Cerrar partido</button>
        <button class="boton boton-verde" id="btnNuevoPartido">Crear nuevo partido</button>
      </div>

      <!-- Agregar jugador manual -->
<div class="tarjeta">
  <h2>Agregar jugador</h2>
  <input type="text" id="nuevoNombre" placeholder="Nombre">
  <input type="tel" id="nuevoTelefono" placeholder="Teléfono (opcional)">
  <button class="boton boton-verde" id="btnAgregarJugador">Agregar</button>
  <button class="boton boton-rojo" id="btnLimpiarInscriptos" style="margin-top:8px;">Limpiar todos los inscriptos</button>
</div>

      <!-- Lista de inscriptos -->
      <div class="tarjeta">
        <h2>Jugadores anotados</h2>
        <ul class="lista-inscriptos" id="listaInscriptosAdmin"></ul>
      </div>

      <!-- Equipos -->
      <div class="tarjeta" id="equiposCard" style="display:none;">
        <h2>Equipos</h2>
        <p id="estadoCupo"></p>
        
        <!-- Zona de disponibles -->
        <div id="zonaDisponibles">
          <h3>Disponibles</h3>
          <div id="contenedorDisponibles"></div>
        </div>

        <!-- Zonas de equipos -->
        <div style="display:flex; gap:8px;">
          <div class="equipo" style="flex:1;" id="equipoA" ondragover="permitirSoltar(event)" ondrop="soltarEnEquipo(event, 'A')">
            <h3>Equipo A</h3>
            <ul id="listaEquipoA"></ul>
          </div>
          <div class="equipo" style="flex:1;" id="equipoB" ondragover="permitirSoltar(event)" ondrop="soltarEnEquipo(event, 'B')">
            <h3>Equipo B</h3>
            <ul id="listaEquipoB"></ul>
          </div>
        </div>

        <button class="boton boton-verde" id="btnCompartirWhatsApp" style="display:none; margin-top:12px;">Compartir por WhatsApp</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ⚠️ PEGÁ ACA TU CONFIGURACIÓN DE FIREBASE
    const firebaseConfig = {
  apiKey: "AIzaSyDs7dUZPdqYvjI7AjYx0RoDoS3X1auaN3A",
  authDomain: "emabol-stars.firebaseapp.com",
  projectId: "emabol-stars",
  storageBucket: "emabol-stars.firebasestorage.app",
  messagingSenderId: "908515702679",
  appId: "1:908515702679:web:583944869a7dd163d276d2"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const PARTIDO_ID = "proximo-partido";
    const partidoRef = db.collection('partidos').doc(PARTIDO_ID);
    const inscriptosRef = partidoRef.collection('inscriptos');

    let partidoActual = null;
    let titularesActuales = []; // jugadores activos dentro del cupo
    let equiposActuales = { A: [], B: [] }; // { A: [ids], B: [ids] }

    // Manejo de sesión
    auth.onAuthStateChanged((user) => {
      if (user) {
        mostrarPanel();
        cargarDatos();
      } else {
        mostrarLogin();
      }
    });

    function mostrarLogin() {
      document.getElementById('login').classList.remove('oculto');
      document.getElementById('panelAdmin').classList.add('oculto');
    }

    function mostrarPanel() {
      document.getElementById('login').classList.add('oculto');
      document.getElementById('panelAdmin').classList.remove('oculto');
    }

    // Login
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.classList.add('oculto');
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        errorDiv.textContent = 'Error: ' + error.message;
        errorDiv.classList.remove('oculto');
      }
    });

    // Logout
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await auth.signOut();
    });

    // Cargar datos del partido y suscripciones
    function cargarDatos() {
      partidoRef.onSnapshot((doc) => {
        if (doc.exists) {
          partidoActual = doc.data();
          document.getElementById('fecha').value = partidoActual.fecha || '';
          document.getElementById('hora').value = partidoActual.hora || '';
          document.getElementById('lugar').value = partidoActual.lugar || '';
          document.getElementById('costo').value = partidoActual.costo || 0;
          document.getElementById('cupo').value = partidoActual.cupo || 18;
          document.getElementById('aliasPago').value = partidoActual.aliasPago || 'CASANAKED';
          document.getElementById('estado').value = partidoActual.estado || 'abierto';
          actualizarSeccionEquipos();
        }
      });

      inscriptosRef.orderBy('timestamp').onSnapshot((snapshot) => {
        const lista = document.getElementById('listaInscriptosAdmin');
        lista.innerHTML = '';
        const activos = [];

        snapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement('li');
          const estadoClase = data.estado === 'activo' ? 'estado-activo' : 'estado-baja';
          li.innerHTML = `
            <div>
              <strong>${data.nombre}</strong>
              ${data.telefono ? `<br><small>${data.telefono}</small>` : ''}
              <br><span class="${estadoClase}">${data.estado}</span>
            </div>
            <div>
              ${data.estado === 'activo' 
                ? `<button class="boton boton-rojo" onclick="cambiarEstado('${doc.id}', 'baja')">Dar de baja</button>` 
                : `<button class="boton boton-verde" onclick="cambiarEstado('${doc.id}', 'activo')">Reactivar</button>`}
              <button class="boton boton-gris" onclick="eliminarJugador('${doc.id}')">Eliminar</button>
            </div>
          `;
          lista.appendChild(li);

          if (data.estado === 'activo') {
            activos.push({ id: doc.id, nombre: data.nombre, telefono: data.telefono || '', timestamp: data.timestamp });
          }
        });

        activos.sort((a, b) => {
          const ta = a.timestamp ? (a.timestamp.toMillis ? a.timestamp.toMillis() : a.timestamp) : Number.MAX_SAFE_INTEGER;
          const tb = b.timestamp ? (b.timestamp.toMillis ? b.timestamp.toMillis() : b.timestamp) : Number.MAX_SAFE_INTEGER;
          return ta - tb;
        });

        const cupo = partidoActual?.cupo || 18;
        titularesActuales = activos.slice(0, cupo);
        actualizarSeccionEquipos();
      });
    }

    // Actualizar sección de equipos
    function actualizarSeccionEquipos() {
      const equiposCard = document.getElementById('equiposCard');
      const estadoCupo = document.getElementById('estadoCupo');

      if (!partidoActual) {
        equiposCard.style.display = 'none';
        return;
      }

      const cupo = partidoActual.cupo || 18;
      const cantidadTitulares = titularesActuales.length;
      const completo = cantidadTitulares >= cupo;

      equiposCard.style.display = 'block';
      estadoCupo.textContent = `Titulares: ${cantidadTitulares} de ${cupo}. ${completo ? '✅ Cupo completo' : `Faltan ${cupo - cantidadTitulares} para completar.`}`;

      // Limpiar listas de equipos y disponibles
      const disponibles = document.getElementById('contenedorDisponibles');
      disponibles.innerHTML = '';
      document.getElementById('listaEquipoA').innerHTML = '';
      document.getElementById('listaEquipoB').innerHTML = '';
      equiposActuales = { A: [], B: [] };

      // Crear elementos arrastrables para cada titular
      titularesActuales.forEach(jugador => {
        const div = document.createElement('div');
        div.className = 'jugador-disponible';
        div.textContent = jugador.nombre;
        div.draggable = true;
        div.id = 'jugador-' + jugador.id;
        div.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', jugador.id);
        });
        disponibles.appendChild(div);
      });

      document.getElementById('btnCompartirWhatsApp').style.display = 'none';
    }

    // Funciones de arrastrar y soltar
    window.permitirSoltar = (e) => {
      e.preventDefault();
      e.target.closest('.equipo').classList.add('drag-over');
    };

    window.soltarEnEquipo = (e, equipo) => {
      e.preventDefault();
      const jugadorId = e.dataTransfer.getData('text/plain');
      const jugador = titularesActuales.find(j => j.id === jugadorId);
      if (!jugador) return;

      // Remover de cualquier equipo anterior
      if (equiposActuales.A.includes(jugadorId)) {
        equiposActuales.A = equiposActuales.A.filter(id => id !== jugadorId);
      }
      if (equiposActuales.B.includes(jugadorId)) {
        equiposActuales.B = equiposActuales.B.filter(id => id !== jugadorId);
      }

      // Agregar al equipo correspondiente
      if (equipo === 'A') {
        equiposActuales.A.push(jugadorId);
      } else {
        equiposActuales.B.push(jugadorId);
      }

      // Remover de disponibles
      const disponibles = document.getElementById('contenedorDisponibles');
      const divJugador = document.getElementById('jugador-' + jugadorId);
      if (divJugador && divJugador.parentNode === disponibles) {
        divJugador.remove();
      }

      // Renderizar equipos
      renderizarEquipos();

      // Mostrar botón de compartir si hay jugadores en ambos equipos
      if (equiposActuales.A.length > 0 && equiposActuales.B.length > 0) {
        document.getElementById('btnCompartirWhatsApp').style.display = 'inline-block';
      }

      e.target.closest('.equipo').classList.remove('drag-over');
    };

    function renderizarEquipos() {
      const listaA = document.getElementById('listaEquipoA');
      const listaB = document.getElementById('listaEquipoB');
      listaA.innerHTML = '';
      listaB.innerHTML = '';

      equiposActuales.A.forEach(id => {
        const jugador = titularesActuales.find(j => j.id === id);
        if (jugador) {
          const li = document.createElement('li');
          li.textContent = jugador.nombre;
          li.draggable = true;
          li.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', jugador.id);
          });
          listaA.appendChild(li);
        }
      });

      equiposActuales.B.forEach(id => {
        const jugador = titularesActuales.find(j => j.id === id);
        if (jugador) {
          const li = document.createElement('li');
          li.textContent = jugador.nombre;
          li.draggable = true;
          li.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', jugador.id);
          });
          listaB.appendChild(li);
        }
      });
    }

    // Compartir por WhatsApp
    document.getElementById('btnCompartirWhatsApp').addEventListener('click', () => {
      if (!partidoActual) return;

      const fecha = partidoActual.fecha || '';
      const hora = partidoActual.hora || '';
      const lugar = partidoActual.lugar || '';

      const nombresA = equiposActuales.A.map(id => titularesActuales.find(j => j.id === id)?.nombre || '');
      const nombresB = equiposActuales.B.map(id => titularesActuales.find(j => j.id === id)?.nombre || '');

      let mensaje = `⚽ *Emabol Champ*\n`;
      mensaje += `📅 ${fecha} - ${hora}\n`;
      mensaje += `📍 ${lugar}\n\n`;
      mensaje += `*Equipo A:*\n`;
      nombresA.forEach((nombre, i) => mensaje += `${i + 1}. ${nombre}\n`);
      mensaje += `\n*Equipo B:*\n`;
      nombresB.forEach((nombre, i) => mensaje += `${i + 1}. ${nombre}\n`);
      mensaje += `\n¡Nos vemos! 💪`;

      const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    });

    // Guardar cambios del partido
    document.getElementById('btnGuardarPartido').addEventListener('click', async () => {
      const fecha = document.getElementById('fecha').value.trim();
      const hora = document.getElementById('hora').value.trim();
      const lugar = document.getElementById('lugar').value.trim();
      const costo = Number(document.getElementById('costo').value);
      const cupo = Number(document.getElementById('cupo').value);
      const estado = document.getElementById('estado').value;
      const mensaje = document.getElementById('guardarMensaje');
      const aliasPago = document.getElementById('aliasPago').value.trim();
      mensaje.classList.add('oculto');

      if (!fecha || !hora || !lugar) {
        alert('Completá fecha, hora y lugar');
        return;
      }

      try {
        await partidoRef.set({ fecha, hora, lugar, costo, cupo, estado, aliasPago }, { merge: true });
        mensaje.textContent = '✅ Partido actualizado correctamente';
        mensaje.className = 'exito';
        mensaje.classList.remove('oculto');
        setTimeout(() => mensaje.classList.add('oculto'), 3000);
      } catch (error) {
        console.error('Error al guardar:', error);
        mensaje.textContent = '❌ Error al guardar: ' + error.message;
        mensaje.className = 'error';
        mensaje.classList.remove('oculto');
      }
    });

    // Cerrar partido actual
    document.getElementById('btnCerrarPartido').addEventListener('click', async () => {
      if (!confirm('¿Seguro que querés cerrar este partido? Los jugadores ya no podrán anotarse.')) return;
      try {
        await partidoRef.update({ estado: 'cerrado' });
        alert('Partido cerrado correctamente');
      } catch (error) {
        alert('Error al cerrar: ' + error.message);
      }
    });

    // Crear nuevo partido
    document.getElementById('btnNuevoPartido').addEventListener('click', async () => {
      if (!confirm('¿Crear un nuevo partido? Se reiniciarán los datos del formulario.')) return;
      try {
        // Limpiar los campos del formulario
        document.getElementById('fecha').value = '';
        document.getElementById('hora').value = '';
        document.getElementById('lugar').value = '';
        document.getElementById('costo').value = 0;
        document.getElementById('cupo').value = 18;
        document.getElementById('estado').value = 'abierto';
        alert('Completá los datos del nuevo partido y guardalos.');
      } catch (error) {
        alert('Error: ' + error.message);
      }
    });

    // Agregar jugador manual
    document.getElementById('btnAgregarJugador').addEventListener('click', async () => {
      const nombre = document.getElementById('nuevoNombre').value.trim();
      const telefono = document.getElementById('nuevoTelefono').value.trim();

      if (!nombre) {
        alert('Poné un nombre');
        return;
      }

      const nuevoId = 'manual-' + Date.now();
      try {
        await inscriptosRef.doc(nuevoId).set({
          nombre,
          telefono,
          estado: 'activo',
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('nuevoNombre').value = '';
        document.getElementById('nuevoTelefono').value = '';
      } catch (error) {
        alert('Error al agregar: ' + error.message);
      }
    });

    // Limpiar todos los inscriptos
document.getElementById('btnLimpiarInscriptos').addEventListener('click', async () => {
  if (!confirm('⚠️ ¿Seguro que querés eliminar TODOS los inscriptos? Esta acción no se puede deshacer.')) return;
  
  try {
    // Obtener todos los documentos de la subcolección inscriptos
    const snapshot = await inscriptosRef.get();
    
    if (snapshot.empty) {
      alert('No hay inscriptos para eliminar.');
      return;
    }
    
    // Mostrar progreso
    const totalDocs = snapshot.size;
    let eliminados = 0;
    
    // Crear array de promesas para eliminar en paralelo
    const promesas = [];
    snapshot.forEach((doc) => {
      promesas.push(doc.ref.delete());
    });
    
    // Ejecutar todas las eliminaciones
    await Promise.all(promesas);
    
    alert(`✅ Se eliminaron ${totalDocs} inscriptos correctamente.`);
  } catch (error) {
    console.error('Error al limpiar inscriptos:', error);
    alert('❌ Error al limpiar inscriptos: ' + error.message);
  }
});

    // Cambiar estado (activo/baja)
    window.cambiarEstado = async (id, nuevoEstado) => {
      try {
        await inscriptosRef.doc(id).update({ estado: nuevoEstado });
      } catch (error) {
        alert('Error al cambiar estado: ' + error.message);
      }
    };

    // Eliminar jugador
    window.eliminarJugador = async (id) => {
      if (!confirm('¿Seguro que querés eliminar este jugador?')) return;
      try {
        await inscriptosRef.doc(id).delete();
      } catch (error) {
        alert('Error al eliminar: ' + error.message);
      }
    };
  </script>
</body>
</html>
