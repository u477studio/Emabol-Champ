<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Emabol Champ</title>
  <style>
    :root {
      --verde: #2e7d32;
      --rojo: #c62828;
      --azul: #1565c0;
      --gris: #f5f5f5;
    }
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: var(--gris); }
    .contenedor { max-width: 600px; margin: 0 auto; padding: 16px; }
    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    h3 { margin: 8px 0; }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .boton {
      display: inline-block;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px 2px;
    }
    .boton-verde { background: var(--verde); color: white; }
    .boton-rojo { background: var(--rojo); color: white; }
    .boton-azul { background: var(--azul); color: white; }
    .boton-gris { background: #666; color: white; }
    .oculto { display: none; }
    .lista-inscriptos { list-style: none; padding: 0; }
    .lista-inscriptos li {
      padding: 10px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    .estado-activo { color: var(--verde); font-weight: bold; }
    .estado-baja { color: var(--rojo); font-weight: bold; }
    .error { color: var(--rojo); margin: 8px 0; }
    .exito { color: var(--verde); margin: 8px 0; }
    .equipo {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
    }
    .equipo ul { list-style: none; padding: 0; }
    .equipo li {
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <!-- Login -->
    <div id="login" class="tarjeta">
      <h1>🔐 Admin Emabol</h1>
      <div id="loginError" class="error oculto"></div>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button class="boton boton-verde" id="btnLogin">Entrar</button>
    </div>

    <!-- Panel admin (oculto hasta loguearse) -->
    <div id="panelAdmin" class="oculto">
      <div class="tarjeta">
        <h1>⚽ Admin Emabol</h1>
        <button class="boton boton-gris" id="btnLogout">Cerrar sesión</button>
      </div>

      <!-- Editar partido -->
      <div class="tarjeta">
        <h2>Próximo partido</h2>
        <div id="guardarMensaje" class="oculto"></div>
        <label>Fecha</label>
        <input type="text" id="fecha">
        <label>Hora</label>
        <input type="text" id="hora">
        <label>Lugar</label>
        <input type="text" id="lugar">
        <label>Costo por jugador</label>
        <input type="number" id="costo">
        <label>Cupo</label>
        <input type="number" id="cupo">
        <label>Estado</label>
        <select id="estado">
          <option value="abierto">Abierto</option>
          <option value="cerrado">Cerrado</option>
        </select>
        <button class="boton boton-azul" id="btnGuardarPartido">Guardar cambios</button>
      </div>

      <!-- Agregar jugador manual -->
      <div class="tarjeta">
        <h2>Agregar jugador</h2>
        <input type="text" id="nuevoNombre" placeholder="Nombre">
        <input type="tel" id="nuevoTelefono" placeholder="Teléfono (opcional)">
        <button class="boton boton-verde" id="btnAgregarJugador">Agregar</button>
      </div>

      <!-- Lista de inscriptos -->
      <div class="tarjeta">
        <h2>Jugadores anotados</h2>
        <ul class="lista-inscriptos" id="listaInscriptosAdmin"></ul>
      </div>

      <!-- Equipos -->
      <div class="tarjeta" id="equiposCard" style="display:none;">
        <h2>Equipos</h2>
        <p id="estadoCupo"></p>
        <button class="boton boton-azul" id="btnArmarEquipos">Armar equipos aleatoriamente</button>
        <div id="equiposResultado" style="margin-top:12px;">
          <div class="equipo">
            <h3>Equipo A</h3>
            <ul id="equipoA"></ul>
          </div>
          <div class="equipo">
            <h3>Equipo B</h3>
            <ul id="equipoB"></ul>
          </div>
        </div>
        <button class="boton boton-verde" id="btnCompartirWhatsApp" style="display:none; margin-top:12px;">Compartir por WhatsApp</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // ⚠️ PEGÁ ACA TU CONFIGURACIÓN DE FIREBASE (la misma del index.html)
    const firebaseConfig = {
  apiKey: "AIzaSyDs7dUZPdqYvjI7AjYx0RoDoS3X1auaN3A",
  authDomain: "emabol-stars.firebaseapp.com",
  projectId: "emabol-stars",
  storageBucket: "emabol-stars.firebasestorage.app",
  messagingSenderId: "908515702679",
  appId: "1:908515702679:web:583944869a7dd163d276d2"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const PARTIDO_ID = "proximo-partido";
    const partidoRef = db.collection('partidos').doc(PARTIDO_ID);
    const inscriptosRef = partidoRef.collection('inscriptos');

    let partidoActual = null;
    let titularesActuales = []; // jugadores activos dentro del cupo

    // Manejo de sesión
    auth.onAuthStateChanged((user) => {
      if (user) {
        mostrarPanel();
        cargarDatos();
      } else {
        mostrarLogin();
      }
    });

    function mostrarLogin() {
      document.getElementById('login').classList.remove('oculto');
      document.getElementById('panelAdmin').classList.add('oculto');
    }

    function mostrarPanel() {
      document.getElementById('login').classList.add('oculto');
      document.getElementById('panelAdmin').classList.remove('oculto');
    }

    // Login
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');
      errorDiv.classList.add('oculto');
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        errorDiv.textContent = 'Error: ' + error.message;
        errorDiv.classList.remove('oculto');
      }
    });

    // Logout
    document.getElementById('btnLogout').addEventListener('click', async () => {
      await auth.signOut();
    });

    // Cargar datos del partido y suscripciones
    function cargarDatos() {
      // Datos del partido
      partidoRef.onSnapshot((doc) => {
        if (doc.exists) {
          partidoActual = doc.data();
          document.getElementById('fecha').value = partidoActual.fecha || '';
          document.getElementById('hora').value = partidoActual.hora || '';
          document.getElementById('lugar').value = partidoActual.lugar || '';
          document.getElementById('costo').value = partidoActual.costo || 0;
          document.getElementById('cupo').value = partidoActual.cupo || 18;
          document.getElementById('estado').value = partidoActual.estado || 'abierto';
          actualizarSeccionEquipos();
        }
      });

      // Lista de inscriptos
      inscriptosRef.orderBy('timestamp').onSnapshot((snapshot) => {
        const lista = document.getElementById('listaInscriptosAdmin');
        lista.innerHTML = '';
        const activos = [];

        snapshot.forEach((doc) => {
          const data = doc.data();
          const li = document.createElement('li');
          const estadoClase = data.estado === 'activo' ? 'estado-activo' : 'estado-baja';
          li.innerHTML = `
            <div>
              <strong>${data.nombre}</strong>
              ${data.telefono ? `<br><small>${data.telefono}</small>` : ''}
              <br><span class="${estadoClase}">${data.estado}</span>
            </div>
            <div>
              ${data.estado === 'activo' 
                ? `<button class="boton boton-rojo" onclick="cambiarEstado('${doc.id}', 'baja')">Dar de baja</button>` 
                : `<button class="boton boton-verde" onclick="cambiarEstado('${doc.id}', 'activo')">Reactivar</button>`}
              <button class="boton boton-gris" onclick="eliminarJugador('${doc.id}')">Eliminar</button>
            </div>
          `;
          lista.appendChild(li);

          if (data.estado === 'activo') {
            activos.push({ id: doc.id, nombre: data.nombre, telefono: data.telefono || '', timestamp: data.timestamp });
          }
        });

        // Ordenar por timestamp
        activos.sort((a, b) => {
          const ta = a.timestamp ? (a.timestamp.toMillis ? a.timestamp.toMillis() : a.timestamp) : Number.MAX_SAFE_INTEGER;
          const tb = b.timestamp ? (b.timestamp.toMillis ? b.timestamp.toMillis() : b.timestamp) : Number.MAX_SAFE_INTEGER;
          return ta - tb;
        });

        // Tomar solo los titulares según cupo
        const cupo = partidoActual?.cupo || 18;
        titularesActuales = activos.slice(0, cupo);
        actualizarSeccionEquipos();
      });
    }

    // Mostrar u ocultar sección de equipos según cupo
    function actualizarSeccionEquipos() {
      const equiposCard = document.getElementById('equiposCard');
      const estadoCupo = document.getElementById('estadoCupo');
      const btnArmar = document.getElementById('btnArmarEquipos');
      const btnCompartir = document.getElementById('btnCompartirWhatsApp');

      if (!partidoActual) {
        equiposCard.style.display = 'none';
        return;
      }

      const cupo = partidoActual.cupo || 18;
      const cantidadTitulares = titularesActuales.length;
      const completo = cantidadTitulares >= cupo;

      equiposCard.style.display = 'block';
      estadoCupo.textContent = `Titulares: ${cantidadTitulares} de ${cupo}. ${completo ? '✅ Cupo completo' : `Faltan ${cupo - cantidadTitulares} para completar.`}`;
      btnArmar.disabled = !completo;
      btnArmar.textContent = completo ? 'Armar equipos aleatoriamente' : 'Esperando completar cupo...';

      // Ocultar resultado anterior si no está completo
      if (!completo) {
        document.getElementById('equiposResultado').style.display = 'none';
        btnCompartir.style.display = 'none';
        document.getElementById('equipoA').innerHTML = '';
        document.getElementById('equipoB').innerHTML = '';
      } else {
        document.getElementById('equiposResultado').style.display = 'block';
      }
    }

    // Armar equipos aleatoriamente
    document.getElementById('btnArmarEquipos').addEventListener('click', () => {
      if (titularesActuales.length < (partidoActual.cupo || 18)) {
        alert('Aún no hay cupo completo.');
        return;
      }

      // Mezclar aleatoriamente (Fisher-Yates)
      const mezclados = [...titularesActuales];
      for (let i = mezclados.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mezclados[i], mezclados[j]] = [mezclados[j], mezclados[i]];
      }

      // Dividir en dos equipos
      const mitad = Math.ceil(mezclados.length / 2);
      const equipoA = mezclados.slice(0, mitad);
      const equipoB = mezclados.slice(mitad);

      // Mostrar en las listas
      const listaA = document.getElementById('equipoA');
      const listaB = document.getElementById('equipoB');
      listaA.innerHTML = '';
      listaB.innerHTML = '';

      equipoA.forEach((jugador) => {
        const li = document.createElement('li');
        li.textContent = jugador.nombre;
        listaA.appendChild(li);
      });

      equipoB.forEach((jugador) => {
        const li = document.createElement('li');
        li.textContent = jugador.nombre;
        listaB.appendChild(li);
      });

      // Mostrar botón de compartir
      document.getElementById('btnCompartirWhatsApp').style.display = 'inline-block';
    });

    // Compartir por WhatsApp
    document.getElementById('btnCompartirWhatsApp').addEventListener('click', () => {
      if (!partidoActual || titularesActuales.length === 0) return;

      const fecha = partidoActual.fecha || '';
      const hora = partidoActual.hora || '';
      const lugar = partidoActual.lugar || '';

      // Obtener nombres de los equipos mostrados
      const equipoA = Array.from(document.querySelectorAll('#equipoA li')).map(li => li.textContent);
      const equipoB = Array.from(document.querySelectorAll('#equipoB li')).map(li => li.textContent);

      let mensaje = `⚽ *Emabol Champ*\n`;
      mensaje += `📅 ${fecha} - ${hora}\n`;
      mensaje += `📍 ${lugar}\n\n`;
      mensaje += `*Equipo A:*\n`;
      equipoA.forEach((nombre, i) => mensaje += `${i + 1}. ${nombre}\n`);
      mensaje += `\n*Equipo B:*\n`;
      equipoB.forEach((nombre, i) => mensaje += `${i + 1}. ${nombre}\n`);
      mensaje += `\n¡Nos vemos! 💪`;

      const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    });

    // Guardar cambios del partido (con set y merge)
    document.getElementById('btnGuardarPartido').addEventListener('click', async () => {
      const fecha = document.getElementById('fecha').value.trim();
      const hora = document.getElementById('hora').value.trim();
      const lugar = document.getElementById('lugar').value.trim();
      const costo = Number(document.getElementById('costo').value);
      const cupo = Number(document.getElementById('cupo').value);
      const estado = document.getElementById('estado').value;
      const mensaje = document.getElementById('guardarMensaje');
      mensaje.classList.add('oculto');

      if (!fecha || !hora || !lugar) {
        alert('Completá fecha, hora y lugar');
        return;
      }

      try {
        await partidoRef.set({ fecha, hora, lugar, costo, cupo, estado }, { merge: true });
        mensaje.textContent = '✅ Partido actualizado correctamente';
        mensaje.className = 'exito';
        mensaje.classList.remove('oculto');
        setTimeout(() => mensaje.classList.add('oculto'), 3000);
      } catch (error) {
        console.error('Error al guardar:', error);
        mensaje.textContent = '❌ Error al guardar: ' + error.message;
        mensaje.className = 'error';
        mensaje.classList.remove('oculto');
      }
    });

    // Agregar jugador manual
    document.getElementById('btnAgregarJugador').addEventListener('click', async () => {
      const nombre = document.getElementById('nuevoNombre').value.trim();
      const telefono = document.getElementById('nuevoTelefono').value.trim();

      if (!nombre) {
        alert('Poné un nombre');
        return;
      }

      const nuevoId = 'manual-' + Date.now();
      try {
        await inscriptosRef.doc(nuevoId).set({
          nombre,
          telefono,
          estado: 'activo',
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('nuevoNombre').value = '';
        document.getElementById('nuevoTelefono').value = '';
      } catch (error) {
        alert('Error al agregar: ' + error.message);
      }
    });

    // Cambiar estado (activo/baja)
    window.cambiarEstado = async (id, nuevoEstado) => {
      try {
        await inscriptosRef.doc(id).update({ estado: nuevoEstado });
      } catch (error) {
        alert('Error al cambiar estado: ' + error.message);
      }
    };

    // Eliminar jugador
    window.eliminarJugador = async (id) => {
      if (!confirm('¿Seguro que querés eliminar este jugador?')) return;
      try {
        await inscriptosRef.doc(id).delete();
      } catch (error) {
        alert('Error al eliminar: ' + error.message);
      }
    };
  </script>
</body>
</html>
